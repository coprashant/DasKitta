# Profile
spring.profiles.default=prod

# Server & Proxy Handling 
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Database (Neon PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.properties.ssl=true
spring.datasource.properties.sslmode=require

# Hikari Connection Pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=45000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Security & CORS (Fixed property mapping)
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:2592000000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
account.unverified-expiry-hours=24

# External APIs
meroshare.api.base-url=${MEROSHARE_BASE_URL:https://webbackend.cdsc.com.np/api}
nepse.api.base-url=${NEPSE_API_URL:http://localhost:8000}

# OTP Email Microservice
email.service.url=${EMAIL_SERVICE_URL}
email.service.api-key=${EMAIL_SERVICE_API_KEY}

# Logging
logging.level.root=WARN
logging.level.com.meroshare.backend=INFO
logging.level.org.springframework.security=WARN

# Redis (Upstash Redis)
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}
spring.data.redis.timeout=3000ms
spring.data.redis.connect-timeout=3000ms

# Cache TTL
cache.nepse.live-ttl-seconds=${NEPSE_LIVE_TTL_SECONDS:10}
cache.cdsc.static-ttl-hours=${CDSC_STATIC_TTL_HOURS:24}

# Company sectors snapshot from NEPSE classification
nepse.company-sectors.refresh-cron=${NEPSE_COMPANY_SECTORS_REFRESH_CRON:0 0 3 1 * *}
nepse.company-sectors.page-size=${NEPSE_COMPANY_SECTORS_PAGE_SIZE:500}
nepse.company-sectors.snapshot-file=${NEPSE_COMPANY_SECTORS_SNAPSHOT_FILE:data/nepse/company-sectors.json}

# OTP
otp.ttl-seconds=${OTP_TTL_SECONDS:300}
otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}

# Rate Limiting
ratelimit.login.max-requests=${RATELIMIT_LOGIN_MAX:5}
ratelimit.login.window-seconds=${RATELIMIT_LOGIN_WINDOW_SECONDS:60}
ratelimit.resend-otp.max-requests=${RATELIMIT_RESEND_OTP_MAX:3}
ratelimit.resend-otp.window-seconds=${RATELIMIT_RESEND_OTP_WINDOW_SECONDS:60}
ratelimit.ipo-apply.max-requests=${RATELIMIT_IPO_APPLY_MAX:10}
ratelimit.ipo-apply.window-seconds=${RATELIMIT_IPO_APPLY_WINDOW_SECONDS:60}