version: '3.8'
services:
  postgres-db:
    image: postgres:16-alpine
    container_name: daskitta-postgres
    environment:
      POSTGRES_DB: meroshare_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Passwordis@123
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: daskitta-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5